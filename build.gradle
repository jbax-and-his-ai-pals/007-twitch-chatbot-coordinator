plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'org.jetbrains.kotlin.jvm' version '2.0.20-RC2'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.20-RC2'
}

repositories {
    mavenCentral()
}

ext {
    ktorVersion = '2.3.13'
}

dependencies {
    // Twitch4J
    implementation 'com.github.twitch4j:twitch4j:1.25.0'

    // YAML Parser
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.1'
    // Correct handling of Kotlin data class defaults/nullability during deserialization
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.19.1'

    // Logging
    implementation "ch.qos.logback:logback-classic:1.5.19"

    implementation 'com.google.cloud:google-cloud-vertexai:1.27.0'

    // GUI control panel: embedded web server + coroutine activity bus
    implementation "io.ktor:ktor-server-core:$ktorVersion"
    implementation "io.ktor:ktor-server-netty:$ktorVersion"
    implementation "io.ktor:ktor-server-content-negotiation:$ktorVersion"
    implementation "io.ktor:ktor-serialization-kotlinx-json:$ktorVersion"
    implementation "io.ktor:ktor-server-websockets:$ktorVersion"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'

    // Used at runtime (not just in tests) to build a synthetic ChannelMessageEvent for the
    // GUI's "simulate incoming message" tool - that Twitch4J type is a final class with a
    // constructor that expects real IRC parsing internals, so a relaxed mock standing in
    // for it is far more robust than hand-assembling one.
    implementation 'io.mockk:mockk:1.13.13'

    // Tests
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "io.ktor:ktor-server-test-host:$ktorVersion"
    testImplementation "io.ktor:ktor-client-websockets:$ktorVersion"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}

compileKotlin { kotlinOptions.jvmTarget = "1.8" }

compileTestKotlin { kotlinOptions.jvmTarget = "1.8" }

test {
    useJUnitPlatform()
}

application {
    mainClass.set("com.github.twitch4j.chatbot.kotlin.controller.LauncherKt")
}

task setupBotAccount(type: JavaExec) {
    group = "tools"
    description = "Mint a new bot account's Twitch IRC OAuth token: ./gradlew setupBotAccount -PclientId=... -PclientSecret=... [-Pport=3000]"
    mainClass = "com.github.twitch4j.chatbot.kotlin.tools.AccountSetupKt"
    classpath = sourceSets.main.runtimeClasspath
    doFirst {
        def clientId = project.findProperty('clientId')
        def clientSecret = project.findProperty('clientSecret')
        if (!clientId || !clientSecret) {
            throw new GradleException("Usage: ./gradlew setupBotAccount -PclientId=... -PclientSecret=... [-Pport=3000]")
        }
        args = [clientId, clientSecret, project.findProperty('port') ?: '3000']
    }
}
