plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'org.jetbrains.kotlin.jvm' version '2.0.20-RC2'
}

repositories {
    mavenCentral()
}

dependencies {
    // Twitch4J
    implementation 'com.github.twitch4j:twitch4j:1.25.0'

    // YAML Parser
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.1'
    // Correct handling of Kotlin data class defaults/nullability during deserialization
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.19.1'

    // Logging
    implementation "ch.qos.logback:logback-classic:1.5.19"

    implementation 'com.google.cloud:google-cloud-vertexai:1.27.0'

    // Tests
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.mockk:mockk:1.13.13'
}

compileKotlin { kotlinOptions.jvmTarget = "1.8" }

compileTestKotlin { kotlinOptions.jvmTarget = "1.8" }

test {
    useJUnitPlatform()
}

application {
    mainClass.set("com.github.twitch4j.chatbot.kotlin.controller.LauncherKt")
}

task setupBotAccount(type: JavaExec) {
    group = "tools"
    description = "Mint a new bot account's Twitch IRC OAuth token: ./gradlew setupBotAccount -PclientId=... -PclientSecret=... [-Pport=3000]"
    mainClass = "com.github.twitch4j.chatbot.kotlin.tools.AccountSetupKt"
    classpath = sourceSets.main.runtimeClasspath
    doFirst {
        def clientId = project.findProperty('clientId')
        def clientSecret = project.findProperty('clientSecret')
        if (!clientId || !clientSecret) {
            throw new GradleException("Usage: ./gradlew setupBotAccount -PclientId=... -PclientSecret=... [-Pport=3000]")
        }
        args = [clientId, clientSecret, project.findProperty('port') ?: '3000']
    }
}
